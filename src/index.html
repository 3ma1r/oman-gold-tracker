<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- Run before styles/body paint; ThemeService uses the same key and light fallback. -->
  <script id="theme-init">
    (function () {
      var theme = 'light';
      try {
        if (localStorage.getItem('oman-gold-tracker.theme') === 'dark') theme = 'dark';
      } catch (_) {}
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <title>الذهب العُماني | أسعار الذهب في عُمان</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" as="image" href="images/oman-gold-hero.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
